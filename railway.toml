[build]
builder = "NIXPACKS"

[build.env]
NODE_ENV = "production"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
sleepApplication = false

[[plugins]]
name = "NIXPACKS"

# Variables de entorno OBLIGATORIAS (configura en Railway Dashboard → Variables):
#
#   MONGODB_URI       = mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/flotamanager?retryWrites=true&w=majority
#   JWT_SECRET        = (string aleatoria >= 32 caracteres. Usa: openssl rand -hex 32)
#   ADMIN_USER        = admin
#   ADMIN_PASSWORD    = (contraseña fuerte: 10+ chars, mayúsc/minúsc/núm/símb)
#   CLIENT_ORIGIN     = https://tu-frontend.netlify.app  (¡sin barra al final!)
#                       O bien múltiples orígenes separados por coma:
#                       https://a.netlify.app,https://b.example.com
#
# Variables de entorno OPCIONALES:
#
#   NODE_ENV                 = production   (ya viene definida arriba)
#   PORT                     = Railway inyecta esta variable; no necesitas cambiarla
#   JWT_EXPIRES_IN           = 12h          (duración tokens)
#   RATE_LIMIT_WINDOW_MS     = 900000       (15 min)
#   RATE_LIMIT_MAX           = 200          (peticiones por ventana por IP)
#   LOGIN_RATE_LIMIT_MAX     = 8            (intentos login por 15 min)
#   PAYLOAD_LIMIT            = 100kb
